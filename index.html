<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINX</title>
<meta name="description" content="MINX – Minecraft Server">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>">
<style>
  :root{ --fg:#f5f5f7; --bg:#0a0a0b; --muted:#8b8b90; --line:#1e1e22; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ width:100%; max-width:560px; text-align:center; animation:fade .9s ease both; }
  .logo{
    font-size:clamp(64px,18vw,120px); font-weight:700; letter-spacing:.14em;
    margin:0 0 6px; line-height:1; padding-left:.14em;
  }
  .sub{ color:var(--muted); font-size:15px; letter-spacing:.22em; text-transform:uppercase; margin:0 0 40px; }
  .card{
    border:1px solid var(--line); border-radius:18px; padding:26px 24px;
    background:linear-gradient(180deg,#111113,#0c0c0e);
  }
  .row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child{ border-bottom:0; }
  .row .k{ color:var(--muted); }
  .row .v{ font-weight:600; }
  code{ font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:13.5px; color:#fff; background:#17171a; padding:3px 8px; border-radius:7px; }
  .hint{ color:var(--muted); font-size:13px; margin-top:14px; }
  .foot{ color:var(--muted); font-size:12.5px; margin-top:34px; letter-spacing:.04em; }
  a{ color:var(--fg); }
  @keyframes fade{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="logo">MINX</h1>
    <p class="sub">Minecraft Server</p>

    <section class="card">
      <div class="row"><span class="k">Edition</span><span class="v">Java</span></div>
      <div class="row"><span class="k">Version</span><span class="v">26.2 · Fabric</span></div>
      <div class="row"><span class="k">Adresse</span><span class="v"><code>wohixtkjsylk3md2.myfritz.net</code></span></div>
      <p class="hint">Verbinden: Minecraft → Mehrspieler → Server hinzufügen → obige Adresse einfügen.</p>
    </section>

    <p class="foot">by ZickZackBoss &amp; BobBobinson007</p>
  </main>
</body>
</html>
